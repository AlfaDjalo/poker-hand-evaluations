stage:
  name: "hand_category_bootstrap"
  cycles: 1

  io:
    load_encoder: true
    load_head: true
    save_encoder: true
    save_head: true

  defaults:
    encoder_lr: 1e-4
    head_lr: 1e-3

  jobs:
    - name: "category_separate"
      mode: "hand_category"
      submode: "separate"
      epochs: 20
    - name: "value_separate"
      mode: "value"
      submode: "separate"
      epochs: 35
    - name: "pairwise_separate"
      mode: "alternating"
      submode: "separate"
      epochs: 30
    - name: "pairwise_combined"
      mode: "alternating"
      submode: "combined"
      epochs: 20
    - name: "value_combined"
      mode: "value"
      submode: "combined"
      epochs: 10
    - name: "hand_category_combined"
      mode: "hand_category"
      submode: "combined"
      epochs: 5
