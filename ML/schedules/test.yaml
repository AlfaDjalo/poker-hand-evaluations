stage:
  name: "test_stage"
  cycles: 1
  io:
    load_encoder: true
    load_head: false
    save_encoder: false
    save_head: true
  defaults:
    encoder_lr: 0.0001
    head_lr: 0.001
  jobs:
    - name: "value_separate"
      mode: "value"
      submode: "combined"
      epochs: 3
      full_confusion: true
    - name: "pairwise_combined"
      mode: "alternating"
      submode: "combined"
      epochs: 3
    - name: "pairwise_separate"
      mode: "alternating"
      submode: "separate"
      epochs: 3


